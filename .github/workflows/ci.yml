name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Byte-compile all sources
        run: python -m compileall src tests examples

      - name: Run unit tests (stdlib unittest, no third-party deps)
        run: python -m unittest discover -s tests -v

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify the py.typed marker ships in the wheel
        run: |
          python - <<'PY'
          import glob, zipfile, sys
          wheels = glob.glob("dist/*.whl")
          assert wheels, "no wheel was built"
          with zipfile.ZipFile(wheels[0]) as zf:
              names = zf.namelist()
          marker = "prod_gemini_agent/py.typed"
          assert marker in names, f"{marker} missing from wheel: {names}"
          print(f"OK: {marker} is present in {wheels[0]}")
          PY
